<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UberRacer: Controller</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh; background: #0f172a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; position: fixed; inset: 0;
    touch-action: none;
  }
  #game-canvas { display: block; position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; }
  
  #street-hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 230, 118, 0.3); padding: 4px 14px;
    border-radius: 20px; z-index: 40; font-size: 12px; font-weight: 600; color: #00e676;
    pointer-events: none; text-transform: uppercase; letter-spacing: 0.8px; text-align: center;
  }

  #hud-balance {
    position: fixed; top: 12px; right: 15px;
    background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
    border: 1px solid rgba(56, 189, 248, 0.3); padding: 5px 12px;
    border-radius: 14px; color: #38bdf8; font-size: 13px; font-weight: bold; z-index: 40;
  }

  #mission-hud {
    display: none; position: fixed; left: 25px; bottom: 25px;
    width: 110px; height: 110px; border-radius: 50%; z-index: 50;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-size: 10px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    cursor: pointer; border: 3px solid #ef4444; background: #1e293b;
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); user-select: none;
    transition: transform 0.1s; padding: 10px;
  }
  #mission-hud:active { transform: scale(0.92); }

  .pedal-container {
    position: fixed; right: 25px; bottom: 25px; display: flex; gap: 12px; z-index: 50;
  }
  .pedal {
    width: 90px; height: 90px; background: rgba(0, 230, 118, 0.15);
    backdrop-filter: blur(8px); border: 2px solid #00e676; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 32px; color: #00e676;
    user-select: none; -webkit-user-select: none; box-shadow: 0 0 20px rgba(0,230,118,0.2);
  }
  .pedal.active { background: rgba(0, 230, 118, 0.6); color: #0f172a; }
  #reverse-pedal { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.15); box-shadow: 0 0 20px rgba(56,189,248,0.2); }
  #reverse-pedal.active { background: rgba(56, 189, 248, 0.6); color: #0f172a; }

  #marker-layer { position: fixed; inset: 0; pointer-events: none; z-index: 35; }
  .floating-tag {
    position: absolute; transform: translate(-50%, -100%);
    background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; padding: 2px 8px;
    border-radius: 10px; color: #38bdf8; font-size: 11px; font-weight: bold; text-align: center;
  }

  .tip-popup {
    position: absolute; transform: translate(-50%, -100%);
    color: #00e676; font-size: 20px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 45;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1.2); }
  }

  #start-overlay {
    position: fixed; inset: 0; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    padding: 20px; text-align: center;
  }
  h2 { color: #00e676; margin-bottom: 5px; font-size: 28px; text-shadow: 0 0 20px rgba(0,230,118,0.4); }
  .name-input {
    padding: 12px 18px; font-size: 15px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
    background: rgba(30, 41, 59, 0.8); color: #fff; width: 100%; max-width: 260px; margin-bottom: 12px; text-align: center; outline: none;
  }
  .class-container { display: flex; gap: 10px; margin: 10px 0 20px 0; width: 100%; max-width: 440px; }
  .class-btn {
    flex: 1; padding: 15px 8px; font-size: 15px; border-radius: 12px;
    background: rgba(30, 41, 59, 0.7); border: 2px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer;
    font-weight: bold; transition: 0.2s;
  }
  .class-btn.selected { border-color: #00e676; background: rgba(0,230,118,0.15); color: #00e676; }
  #launch-btn {
    padding: 15px 40px; font-size: 18px; border-radius: 12px;
    background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%); border: none; font-weight: 800; cursor: pointer; color: #0f172a;
  }

  #fight-warning {
    display: none; position: fixed; inset: 0; background: rgba(239, 68, 68, 0.5);
    backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 150;
    font-size: 24px; font-weight: 900; color: #fff; text-align: center; padding: 20px;
  }
  #rotate-warning {
    display: none; position: fixed; inset: 0; background: #0f172a; z-index: 200;
    align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 22px; color: #ffd700;
  }
  @media screen and (orientation: portrait) { #rotate-warning { display: flex; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/landmarks.js"></script>
<script src="/carstats.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="street-hud">📍 E College Ave</div>
<div id="hud-balance">💰 $100</div>

<div id="mission-hud" onclick="tryCancelRide()">
  <span id="dest-label" style="font-size:10px; color:#38bdf8; margin-bottom:2px;">Destination</span>
  <span id="cooldown-text" style="font-size:9px;">READY</span>
</div>

<div id="marker-layer"></div>
<div id="fight-warning">🚨 GROUP FIGHT IN REAR!<br><br>SHAKE PHONE ONCE TO CALM THEM!</div>
<div id="rotate-warning">📱 Please rotate your phone to landscape mode!</div>

<div id="start-overlay">
  <h2>UberRacer: PSU</h2>
  <input type="text" id="driver-name" class="name-input" placeholder="Driver Name" value="Driver 1" maxlength="12">
  <div class="class-container">
    <button class="class-btn selected" onclick="selectVehicleClass(this, 'Small')">Small<br><span style="font-size:10px; color:#94a3b8;">Cap: 2</span></button>
    <button class="class-btn" onclick="selectVehicleClass(this, 'Large')">Large<br><span style="font-size:10px; color:#94a3b8;">Cap: 4</span></button>
    <button class="class-btn" onclick="selectVehicleClass(this, 'Bougie')">Bougie<br><span style="font-size:10px; color:#94a3b8;">Cap: 1</span></button>
  </div>
  <button id="launch-btn" onclick="launchShift()">Launch Shift</button>
</div>

<div class="pedal-container">
  <div id="reverse-pedal" class="pedal">▼</div>
  <div id="gas-pedal" class="pedal">▲</div>
</div>

<script>
  let selectedClass = 'Small';
  let myPlayerId = null;
  let posX = 45, posZ = 45, rotationAngle = 0;   // start on the Beaver & Fraser intersection
  let moveDirection = 0;
  let steeringInput = 0;
  let currentBalance = 100;
  let activePassengers = [];
  let currentPassengerInCar = null;
  let isFighting = false;
  let tripStartTime = 0;
  let lastCancelTime = 0;
  let lastFightTriggerTime = 0;
  const COOLDOWN_MS = 20000;

  const cars = {};
  const landmarks = [];
  const buildingBoxes = [];
  const passengerMeshes = {};
  let destinationMarkerMesh = null;

  const socket = io();

  function selectVehicleClass(btnElement, carClass) {
    document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
    btnElement.classList.add('selected');
    selectedClass = carClass;
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  scene.fog = new THREE.FogExp2(0x2a2a55, 0.003);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = false;
  renderer.domElement.id = 'game-canvas';
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0x8aa0ff, 0x2a2340, 0.95));
  const moon = new THREE.DirectionalLight(0xbcd0ff, 0.7);
  moon.position.set(-60, 90, 40);
  scene.add(moon);

  // ================= THE TOWN =================
  // Seeded RNG so every phone builds the SAME town (Math.random would give each player a different one).
  const rand = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(1855); // PSU was founded in 1855
  const pick = a => a[Math.floor(rand() * a.length)];
  const std = (c, r = 0.85, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, ...extra });
  const lit = c => new THREE.MeshBasicMaterial({ color: c });
  const additive = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, depthWrite: false, blending: THREE.AdditiveBlending });
  const camTarget = new THREE.Vector3();
  const dummy = new THREE.Object3D();

  function box(w, h, d, mat, x, y, z, parent) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); if (parent) parent.add(m); return m;
  }
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  function instance(geo, mat, list, place) {
    const m = new THREE.InstancedMesh(geo, mat, list.length);
    m.frustumCulled = false;
    list.forEach((it, i) => {
      dummy.position.set(0, 0, 0); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1);
      place(it, dummy, m, i); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix);
    });
    m.instanceMatrix.needsUpdate = true; scene.add(m); return m;
  }

  // dusk sky with stars
  scene.background = canvasTex(512, 512, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#070b24'); grd.addColorStop(0.55, '#26275a'); grd.addColorStop(1, '#8a4a63');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${0.3 + rand() * 0.7})`; g.fillRect(rand() * w, rand() * h * 0.5, 1.5, 1.5); }
  });

  // windowed facades: one canvas for the paint, one for the lit windows (emissive)
  const facadeCache = {};
  function facade(base, cols, floors) {
    const key = base + cols + floors;
    if (facadeCache[key]) return facadeCache[key];
    const glowCanvas = document.createElement('canvas');
    const map = canvasTex(cols * 64, floors * 48, (g, W, H) => {
      glowCanvas.width = W; glowCanvas.height = H;
      const e = glowCanvas.getContext('2d');
      g.fillStyle = base; g.fillRect(0, 0, W, H);
      e.fillStyle = '#000'; e.fillRect(0, 0, W, H);
      for (let r = 0; r < floors; r++) for (let c = 0; c < cols; c++) {
        const x = c * 64 + 15, y = r * 48 + 9, on = rand() < 0.5;
        g.fillStyle = '#0c1424'; g.fillRect(x - 3, y - 3, 40, 34);
        g.fillStyle = on ? '#ffd27a' : '#1c2a47'; g.fillRect(x, y, 34, 28);
        g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x - 4, y + 31, 42, 4);
        if (on) { e.fillStyle = rand() < 0.2 ? '#8fd0ff' : '#ffb04a'; e.fillRect(x, y, 34, 28); }
      }
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, H - 5, W, 5);
    });
    return facadeCache[key] = new THREE.MeshStandardMaterial({ map, emissiveMap: new THREE.CanvasTexture(glowCanvas), emissive: 0xffffff, emissiveIntensity: 0.85, roughness: 0.8 });
  }
  function building(w, h, d, color, x, z, parent) {
    const floors = Math.max(1, Math.round(h / 6)), H = floors * 6;
    const sx = facade(color, Math.max(1, Math.round(d / 8)), floors), sz = facade(color, Math.max(1, Math.round(w / 8)), floors);
    const roof = std(0x1a2030, 0.9);
    const b = box(w, H, d, [sx, sx, roof, roof, sz, sz], x, H / 2, z, parent);
    box(w + 0.8, 0.7, d + 0.8, std(0xd8dde8, 0.6), x, H + 0.35, z, parent); // cornice
    if (rand() < 0.5) box(3, 2, 3, roof, x + (rand() - 0.5) * w * 0.5, H + 1.7, z + (rand() - 0.5) * d * 0.5, parent); // rooftop unit
    return b;
  }
  function sign(text, color, w, x, y, z, parent) {
    const tex = canvasTex(256, 64, (g, cw, ch) => {
      g.fillStyle = '#120b08'; g.fillRect(0, 0, cw, ch);
      g.strokeStyle = color; g.lineWidth = 4; g.strokeRect(5, 5, cw - 10, ch - 10);
      g.shadowColor = color; g.shadowBlur = 14; g.fillStyle = color;
      g.font = 'bold 30px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, cw / 2, ch / 2 + 2, cw - 24);
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), new THREE.MeshBasicMaterial({ map: tex }));
    m.position.set(x, y, z); parent.add(m);
  }
  // ================= LANDMARKS (data lives in /landmarks.js, shared with the server) =================
  // Every builder draws one landmark facing +z and returns its depth, which places the drop-off ring in front of the entrance.
  function landmark(L, build) {
    const g = new THREE.Group(); g.position.set(L.x, 0, L.z);
    const d = build(g, L); scene.add(g);
    landmarks.push({ name: L.name, x: L.x, z: L.z, radius: 44 });
    buildingBoxes.push({ name: L.name, box: new THREE.Box3().setFromObject(g).expandByScalar(1), centerX: L.x, centerZ: L.z, dropX: L.x, dropZ: L.z + d / 2 + 10 });
  }

  const white = std(0xeceae2, 0.5), brick = '#9a5240';
  const glassMat = () => std(0x3b82c4, 0.1, { metalness: 0.8, emissive: 0x1d4ed8, emissiveIntensity: 0.7 });
  function cyl(rt, rb, h, seg, mat, x, y, z, g) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); g.add(m); return m; }
  function dome(g, r, y) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), white); m.position.y = y; g.add(m); }
  function portico(g, n, span, h, z) {   // columns, entablature, pediment, steps
    for (let i = 0; i < n; i++) cyl(0.8, 0.9, h, 10, white, -span / 2 + i * span / (n - 1), h / 2, z, g);
    box(span + 3, 1.4, 6, white, 0, h + 0.7, z, g);
    const p = cyl(5, 5, 1.4, 3, white, 0, h + 2.5, z, g); p.rotation.x = -Math.PI / 2; p.scale.set((span + 3) / 8.66, 1, 0.45);
    box(span + 3, 0.8, 7, white, 0, 0.4, z + 1, g);
  }

  const BUILDERS = {
    // Georgian Revival, H-shaped, eight-column portico, slender domed cupola
    oldmain(g) {
      building(24, 24, 18, brick, 0, 0, g);
      [-1, 1].forEach(s => building(14, 24, 30, brick, s * 19, -6, g));
      portico(g, 8, 22, 15, 13);
      cyl(3, 3.4, 6, 12, white, 0, 27, 0, g); dome(g, 3.4, 30);
      cyl(0.15, 0.15, 3, 6, white, 0, 35.5, 0, g);
      return 34;
    },
    library(g) {
      building(58, 24, 30, '#b7b2a3', 0, 0, g);
      box(20, 20, 3, glassMat(), 0, 11, 15.5, g);
      for (let cx = -25; cx <= 25; cx += 10) cyl(0.9, 1, 20, 10, white, cx, 10, 18, g);
      box(56, 2.5, 5, white, 0, 21, 18, g); box(54, 0.8, 5, white, 0, 0.4, 20, g);
      sign('PATTEE & PATERNO', '#e8e3d0', 20, 0, 21, 20.6, g);
      return 34;
    },
    georgian(g, L) {   // Nittany Lion Inn, Rec Hall
      building(L.w, L.h, L.d, brick, 0, 0, g);
      portico(g, L.cols, Math.min(L.w * 0.5, 22), L.h * 0.6, L.d / 2 + 3);
      if (L.cupola) { box(6, 4, 6, white, 0, L.h + 2, 0, g); dome(g, 3.2, L.h + 4); }
      return L.d + 12;
    },
    dorm(g, L) {       // a cluster of towers; colour/height/trim tell the halls apart
      const n = L.towers, w = n > 3 ? 12 : 14;
      for (let i = 0; i < n; i++) {
        const x = (i - (n - 1) / 2) * (w + 4), z = (i % 2) * -5;
        building(w, L.h, 16, L.color, x, z, g);
        if (L.accent) box(w + 0.4, 1.4, 16.4, std(new THREE.Color(L.accent)), x, L.h * 0.5, z, g);   // Pollock's terra-cotta band
        if (L.cap) { cyl(1.8, 2, 3, 8, white, x, L.h + 2.5, z, g); dome(g, 2, L.h + 4); }           // West Halls' Georgian cupolas
      }
      return 30;
    },
    hub(g) {
      building(56, 18, 26, '#8a8f9c', 0, 0, g);
      box(30, 14, 3, glassMat(), 0, 8, 14.5, g);
      box(34, 1, 8, std(0x2b2f3a), 0, 15.5, 16, g);
      sign('HUB-ROBESON CENTER', '#7dd3fc', 24, 0, 16.5, 13.2, g);
      return 34;
    },
    creamery(g) {
      building(38, 12, 22, '#b9a98c', 0, 0, g);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(2.6, 7, 12), std(0xd9a441)); cone.rotation.x = Math.PI; cone.position.set(0, 15.5, 8); g.add(cone);
      [[0xf9a8d4, 3.1, 20.5], [0x6b3f2a, 2.6, 24]].forEach(([c, r, y]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), std(c, 0.6)); s.position.set(0, y, 8); g.add(s); });
      sign('BERKEY CREAMERY', '#f9a8d4', 22, 0, 8, 11.1, g);
      return 34;
    },
    shrine(g) {
      const lime = std(0xd9d3c3, 0.7);
      box(26, 0.5, 20, std(0x8b8f99), 0, 0.25, 0, g);
      box(14, 3, 8, lime, 0, 2, 0, g);
      box(7, 3, 3.2, lime, 0, 5, 0, g);
      [[1.7, 6.8, 2.4], [2.2, 6.6, 1.2]].forEach(([r, y, z]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), lime); s.position.set(0, y, z); g.add(s); });
      [-1.2, 1.2].forEach(x => box(1, 3, 1, lime, x, 5, 2.6, g));
      sign('WE ARE', '#e8e3d0', 8, 0, 2, 4.1, g);
      return 24;
    },
    stadium(g) {       // huge steel-and-concrete bowl, blue seats, spiky light towers, scoreboard
      const bowl = new THREE.Group(); bowl.scale.set(1, 1, 0.8); g.add(bowl);
      const dbl = c => std(c, 0.8, { side: THREE.DoubleSide });
      const wall = new THREE.Mesh(new THREE.CylinderGeometry(30, 27, 20, 40, 1, true), dbl(0x6b7280)); wall.position.y = 10; bowl.add(wall);
      const seats = new THREE.Mesh(new THREE.CylinderGeometry(27, 15, 14, 40, 1, true), dbl(0x1e3a8a)); seats.position.y = 11; bowl.add(seats);
      const field = new THREE.Mesh(new THREE.CircleGeometry(15, 32).rotateX(-Math.PI / 2), std(0x2f8f46, 1)); field.position.y = 0.3; bowl.add(field);
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => { cyl(0.5, 0.5, 38, 6, std(0x9ca3af), sx * 24, 19, sz * 18, bowl); box(5, 3, 0.8, lit(0xfff3c4), sx * 24, 38, sz * 18, bowl); });
      box(14, 6, 1, lit(0x38bdf8), 0, 24, -22, bowl);
      return 36;
    },
    arena(g) {         // Bryce Jordan Center: round red-brick body, big white segmented roof
      cyl(20, 21, 12, 32, std(0x8c4a3c, 0.8), 0, 6, 0, g);
      const roof = new THREE.Mesh(new THREE.SphereGeometry(21, 32, 10, 0, Math.PI * 2, 0, Math.PI / 2), std(0xf1f5f9, 0.5)); roof.scale.y = 0.45; roof.position.y = 12; g.add(roof);
      box(14, 8, 4, glassMat(), 0, 4, 20.5, g);
      sign('BRYCE JORDAN CENTER', '#e8e3d0', 18, 0, 10, 22.6, g);
      return 36;
    },
    hotel(g) {         // Hotel State College at College & Allen: brick, long red awning, Corner Room + Zeno's
      building(42, 30, 26, '#a05a45', 0, 0, g);
      box(44, 0.6, 7, std(0x7f1d1d, 0.6), 0, 7, 16, g).rotation.x = 0.25;
      sign('CORNER ROOM', '#fcd34d', 16, -10, 12, 13.1, g);
      sign("ZENO'S PUB", '#86efac', 14, 11, 12, 13.1, g);
      sign('HOTEL STATE COLLEGE', '#e8e3d0', 22, 0, 26, 13.1, g);
      return 34;
    },
    bar(g, L) {        // bars + restaurants: awning, neon sign, glowing door, string lights, patio
      const w = L.w;
      building(w, 16, 26, L.wall, 0, 0, g);
      box(w + 2, 0.6, 7, std(new THREE.Color(L.accent), 0.6), 0, 6.2, 16, g).rotation.x = 0.3;
      sign(L.text, L.accent, 22, 0, 12.5, 13.1, g);

  const CAR_SPECS = {

  function createCarModel(carClass) {

  // ================= BEACONS & PASSENGERS =================
  function makeBeacon(color, r) {
    const g = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.8, r, 40), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.12;
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.8, r * 0.8, 45, 20, 1, true), additive(color, 0.13));
    beam.material.side = THREE.DoubleSide; beam.position.y = 22;
    g.add(ring, beam); g.userData.ring = ring; return g;
  }
  function makePassengerMesh(size) {
    const g = makeBeacon(0x00e676, 4);
    const shirts = [0x3b82f6, 0xef4444, 0xf59e0b, 0xa855f7, 0xf8fafc], skins = [0xf1c27d, 0xc68642, 0x8d5524, 0xffdbac];

      const a = i / size * Math.PI * 2, p = new THREE.Group();
      const bodyM = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 1.5, 8), std(shirts[Math.floor(Math.random() * 5)])); bodyM.position.y = 0.75;

      p.add(bodyM, head); const rr = size > 1 ? 1.4 : 0; p.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr); g.add(p);
    }
    return g;

  function hitPopup(text) {

    const vx = hx * speedNow + knockX + h.dvx, vz = hz * speedNow + knockZ + h.dvz;   // our new velocity
    speedNow = vx * hx + vz * hz;                          // part along our heading = driving speed

  const FIGHT_CHANCE = 0.35;        // chance a 4-person ride has a fight at all

  let fightAt = 0, shakesLeft = 0, lastShakeTime = 0;

  function scheduleFight() {        // rolled once per pickup
    fightAt = 0;
    if (selectedClass !== 'Large' || !currentPassengerInCar || currentPassengerInCar.size !== 4) return;
    if (Date.now() - lastFightTriggerTime < FIGHT_COOLDOWN_MS) return;

  }
  function renderFight() {
    document.getElementById('fight-warning').innerHTML =
      `🚨 GROUP FIGHT IN REAR!<br><br>SHAKE YOUR PHONE!<br><br>${'💥'.repeat(FIGHT_SHAKES - shakesLeft)}${'⚪'.repeat(shakesLeft)}`;

  function registerShake(e) {
    if (!isFighting) return;
    const acc = e.accelerationIncludingGravity || e.acceleration;
    if (!acc) return;
    const force = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
    const now = Date.now();
    if (force > 26 && now - lastShakeTime > 300) {   // one count per real shake

      if (--shakesLeft <= 0) { lastFightTriggerTime = now; clearFight(); } else renderFight();
    }

  function launchShift() {
    const driverName = document.getElementById('driver-name').value.trim() || 'Driver';
    document.getElementById('start-overlay').style.display = 'none';

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().catch(err => console.warn(err));
    }

    socket.emit('join-game', { name: driverName, carClass: selectedClass });

    window.addEventListener('deviceorientation', (e) => {
      let steeringVal = e.beta || 0;
      let isUpsideDown = window.orientation === -90 || window.screen?.orientation?.angle === 270;
      steeringInput = Math.max(-1, Math.min(1, (steeringVal / 25) * (isUpsideDown ? -1 : 1)));
    }, true);

    window.addEventListener('devicemotion', registerShake, true);
  }

  const gasPedal = document.getElementById('gas-pedal');
  const reversePedal = document.getElementById('reverse-pedal');

  function evaluateTouchPositions(e) {
    let forwardActive = false;
    let reverseActive = false;

    for (let i = 0; i < e.touches.length; i++) {
      let touch = e.touches[i];
      let elem = document.elementFromPoint(touch.clientX, touch.clientY);
      
      if (elem) {
        if (elem === gasPedal || elem.closest('#gas-pedal')) forwardActive = true;
        if (elem === reversePedal || elem.closest('#reverse-pedal')) reverseActive = true;
      }
    }

    if (forwardActive && !reverseActive) {
      moveDirection = 1;
      gasPedal.classList.add('active');
      reversePedal.classList.remove('active');
    } else if (reverseActive && !forwardActive) {
      moveDirection = -1;
      reversePedal.classList.add('active');
      gasPedal.classList.remove('active');
    } else {
      moveDirection = 0;
      gasPedal.classList.remove('active');
      reversePedal.classList.remove('active');
    }
  }

  window.addEventListener('touchstart', evaluateTouchPositions, { passive: false });
  window.addEventListener('touchmove', evaluateTouchPositions, { passive: false });
  window.addEventListener('touchend', evaluateTouchPositions, { passive: false });

  gasPedal.addEventListener('mouseup', () => { moveDirection = 0; gasPedal.classList.remove('active'); });
  reversePedal.addEventListener('mousedown', () => { moveDirection = -1; reversePedal.classList.add('active'); });
  reversePedal.addEventListener('mouseup', () => { moveDirection = 0; reversePedal.classList.remove('active'); });

  // Roads sit at -315 + 90*i. Edit these names freely.
  const STREETS_EW = ['Park Ave', 'Curtin Rd', 'College Ave', 'Calder Way', 'Beaver Ave', 'Foster Ave', 'Hamilton Ave', 'Fairmount Ave']; // north -> south (z)
  const STREETS_NS = ['Shortlidge Rd', 'Pollock Rd', 'Burrowes Rd', 'Allen St', 'Fraser St', 'Garner St', 'Pugh St', 'Atherton St'];       // west -> east (x)
  const roadIndex = v => Math.max(0, Math.min(7, Math.round((v + 315) / 90)));

  function updateHUD(x, z) {
    const zi = roadIndex(z), xi = roadIndex(x);
    const dEW = Math.abs(z - (-315 + 90 * zi)), dNS = Math.abs(x - (-315 + 90 * xi));
    let street;
    if (dEW < 11 && dNS < 11) street = `${STREETS_EW[zi]} & ${STREETS_NS[xi]}`;
    else if (dEW < 11) street = STREETS_EW[zi];
    else if (dNS < 11) street = STREETS_NS[xi];
    else street = 'near ' + (dEW < dNS ? STREETS_EW[zi] : STREETS_NS[xi]);

    let nearbyName = '';
    for (let l of landmarks) {
      if (Math.hypot(x - l.x, z - l.z) < l.radius) { nearbyName = ` (${l.name})`; break; }
    }
    document.getElementById('street-hud').innerHTML = `📍 ${street}${nearbyName}`;
  }

  function updatePassengerTimers() {

    for (let id in passengerMeshes) {

      vector.y += 4;
      vector.project(camera);

      let x = (vector.x *  .5 + .5) * window.innerWidth;
      let y = (vector.y * -.5 + .5) * window.innerHeight;

      if (vector.z < 1) {
        html += `<div class="floating-tag" style="left:${x}px; top:${y}px;">👥${p.size} ⏱️${timeLeft}s</div>`;

  function checkGameTriggers(carVector) {
    if (!currentPassengerInCar) {
      for (let p of activePassengers) {
        if (!p.pickedUpBy) {
          let dist = Math.sqrt((carVector.x - p.x) ** 2 + (carVector.z - p.z) ** 2);
          if (dist < 15) {
            socket.emit('claim-passenger', { passengerId: p.id, carClass: selectedClass });
            break;
          }
        }
      }
    } else if (currentPassengerInCar) {
      for (let b of buildingBoxes) {
        if (b.name === currentPassengerInCar.destName) {
          // Generous radius check around destination building center for smooth drop-off
          let distToDest = Math.hypot(carVector.x - b.dropX, carVector.z - b.dropZ);
          if (distToDest < 16) {
            let payout = (selectedClass === 'Bougie') ? 150 : currentPassengerInCar.tipValue;
            socket.emit('complete-trip', { passengerId: currentPassengerInCar.id, carClass: selectedClass, tip: payout });
            break;
          }
        }
      }
    }
  }

  let speedNow = 0, spinVel = 0, knockX = 0, knockZ = 0;   // current speed, spin-out rate, slide from hits

  function animate() {
    requestAnimationFrame(animate);

    if (fightAt && !isFighting && currentPassengerInCar && Date.now() >= fightAt) startFight();

    const st = CAR_STATS[selectedClass] || CAR_STATS.Small;
    if (Math.abs(spinVel) > 0.03) {                      // spun out: no steering, no gas, just sliding
      rotationAngle += spinVel; spinVel *= 0.965; speedNow *= 0.95;
    } else {
      spinVel = 0;
      const gas = (moveDirection !== 0 && !isFighting) ? moveDirection : 0;
      if (gas) {
        const braking = speedNow !== 0 && Math.sign(gas) !== Math.sign(speedNow);
        speedNow += gas * st.accel * (braking ? 2.5 : 1);   // speed accumulates; braking is stronger
      } else {
        speedNow *= 0.96;                                    // coast down
        if (Math.abs(speedNow) < 0.004) speedNow = 0;
      }
      speedNow = Math.max(-st.max * 0.5, Math.min(st.max, speedNow));
      const grip = Math.min(1, Math.abs(speedNow) / (st.max * 0.3));   // can't steer while stopped
      rotationAngle -= steeringInput * st.turn * grip * Math.sign(speedNow);
    }

    // forward motion + sideways slide from the last hit
    if (speedNow !== 0 || knockX !== 0 || knockZ !== 0) {
      const nextX = posX + Math.sin(rotationAngle) * speedNow + knockX;
      const nextZ = posZ + Math.cos(rotationAngle) * speedNow + knockZ;
      const nextVector = new THREE.Vector3(nextX, 0, nextZ), here = new THREE.Vector3(posX, 0, posZ);
      let collided = false;
      for (let b of buildingBoxes) {
        if (b.box.containsPoint(nextVector) && !b.box.containsPoint(here)) { collided = true; break; }
      }
      if (collided) { speedNow = 0; knockX = knockZ = 0; }
      else { posX = Math.max(-320, Math.min(320, nextX)); posZ = Math.max(-320, Math.min(320, nextZ)); }
      knockX *= 0.9; knockZ *= 0.9;
      if (Math.abs(knockX) < 0.002) knockX = 0;
      if (Math.abs(knockZ) < 0.002) knockZ = 0;
    }

    if (myPlayerId && cars[myPlayerId]) {
      cars[myPlayerId].posX = posX;
      cars[myPlayerId].posZ = posZ;
      cars[myPlayerId].rotationAngle = rotationAngle;

      socket.emit('steering-input', { playerId: myPlayerId, carClass: selectedClass, posX, posZ, rotationAngle, accelerating: (moveDirection !== 0), speed: speedNow });

      let carVector = new THREE.Vector3(posX, 0, posZ);
      checkGameTriggers(carVector);
      updatePassengerTimers();
      updateHUD(posX, posZ);
      updateCooldownUI();
    }

    for (let id in cars) {
      let data = cars[id];
      data.group.position.set(data.posX, 0, data.posZ);
      data.group.rotation.y = data.rotationAngle;

      if (id === myPlayerId) {
        camTarget.set(data.posX - Math.sin(data.rotationAngle) * 8, 3.6, data.posZ - Math.cos(data.rotationAngle) * 8);
        camera.position.lerp(camTarget, 0.15);
        camera.lookAt(data.posX + Math.sin(data.rotationAngle) * 4, 1, data.posZ + Math.cos(data.rotationAngle) * 4);
      }
    }
    const t = performance.now() / 1000;
    for (let id in passengerMeshes) {
      const m = passengerMeshes[id].mesh;
      m.rotation.y = t;
      m.userData.ring.scale.setScalar(1 + Math.sin(t * 4) * 0.08);
    }
    if (destinationMarkerMesh) destinationMarkerMesh.userData.ring.scale.setScalar(1 + Math.sin(t * 4) * 0.1);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
