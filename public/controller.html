<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TrackRacer Cockpit</title>
  <style>
    * { box-sizing: border-box; }
    /* Force absolute full-screen dimensions ignoring mobile browser chrome */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      width: 100dvw !important;
      height: 100dvh !important;
    }
    
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    button {
      padding: 22px 45px;
      font-size: 24px;
      border-radius: 14px;
      background: #00e676;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: #111;
      box-shadow: 0 4px 15px rgba(0,230,118,0.4);
    }
    
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 200;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      font-size: 22px;
      color: gold;
    }
    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="rotate-warning">📱 Please rotate your phone to landscape mode to access the cockpit!</div>

  <div id="start-overlay">
    <h2>TrackRacer Cockpit</h2>
    <p style="color: #aaa; margin-bottom: 25px;">Turn phone sideways & tap to activate steering</p>
    <button id="start-btn">Launch Race</button>
  </div>

  <script>
    const socket = io();
    const btn = document.getElementById('start-btn');
    const overlay = document.getElementById('start-overlay');

    let carMesh, targetX = 0;

    // Three.js Setup on Phone
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 6);
    camera.lookAt(0, 0, -5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(50, 50, 0x00ffff, 0x444444);
    gridHelper.position.z = -10;
    scene.add(gridHelper);

    const geometry = new THREE.BoxGeometry(1, 0.8, 2);
    const material = new THREE.MeshStandardMaterial({ color: 0xff1744 });
    carMesh = new THREE.Mesh(geometry, material);
    carMesh.position.set(0, 0.4, 0);
    scene.add(carMesh);

    btn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            alert("Motion permission is required to steer!");
            return;
          }
        } catch (e) {
          console.error("Permission error:", e);
        }
      }

      overlay.style.display = 'none';
      socket.emit('join-game');

      // Listen for orientation changes using 'beta' for horizontal landscape tilt steering
      window.addEventListener('deviceorientation', (e) => {
        // When holding a phone sideways in landscape, 'beta' maps to tilting the left/right sides up and down like a steering wheel.
        let steeringVal = e.beta || 0; 
        
        let mappedX = (steeringVal / 35) * 5;
        targetX = Math.max(-6, Math.min(6, mappedX));

        socket.emit('steering-input', { 
          playerId: socket.id, 
          tilt: Math.round(steeringVal) 
        });
      }, true);
    });

    function animate() {
      requestAnimationFrame(animate);
      carMesh.position.x += (targetX - carMesh.position.x) * 0.1;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
