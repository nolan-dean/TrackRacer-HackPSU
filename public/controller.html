<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TrackRacer Cockpit</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh; background: #111; color: #fff;
      font-family: sans-serif; overflow: hidden; position: fixed; inset: 0;
    }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
    #start-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    button {
      padding: 22px 45px; font-size: 24px; border-radius: 14px;
      background: #00e676; border: none; font-weight: bold; cursor: pointer; color: #111;
      box-shadow: 0 4px 15px rgba(0,230,118,0.4);
    }
    #gas-pedal {
      display: none; position: fixed; right: 30px; bottom: 30px;
      width: 120px; height: 120px; background: rgba(0, 230, 118, 0.2);
      border: 3px solid #00e676; border-radius: 50%; z-index: 50;
      align-items: center; justify-content: center; font-size: 42px; color: #00e676;
      user-select: none; -webkit-user-select: none; box-shadow: 0 0 20px rgba(0,230,118,0.3);
    }
    #gas-pedal:active, #gas-pedal.active {
      background: rgba(0, 230, 118, 0.7); color: #111; transform: scale(0.95);
    }
    #rotate-warning {
      display: none; position: fixed; inset: 0; background: #111; z-index: 200;
      align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 22px; color: gold;
    }
    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="rotate-warning">📱 Please rotate your phone to landscape mode to access the cockpit!</div>

  <div id="start-overlay">
    <h2>TrackRacer Cockpit</h2>
    <p style="color: #aaa; margin-bottom: 25px;">Turn phone sideways & tap to activate steering</p>
    <button id="start-btn">Launch Race</button>
  </div>

  <div id="gas-pedal">▲</div>

  <script>
    const socket = io();
    const btn = document.getElementById('start-btn');
    const overlay = document.getElementById('start-overlay');
    const gasPedal = document.getElementById('gas-pedal');

    let myPlayerId = null;
    let targetX = 0, zPos = 0, isAccelerating = false;
    const cars = {};

    // Three.js Setup on Phone with Chase Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 4); // Chase cam position

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(100, 50, 0x00ffff, 0x444444);
    gridHelper.position.z = -20;
    scene.add(gridHelper);

    socket.on('assigned-player', (data) => {
      myPlayerId = data.playerId;
    });

    socket.on('sync-players', (players) => {
      for (let id in players) {
        if (!cars[id]) {
          const pData = players[id];
          const geometry = new THREE.BoxGeometry(1, 0.8, 2);
          const material = new THREE.MeshStandardMaterial({ color: pData.color || 0xff1744 });
          const carMesh = new THREE.Mesh(geometry, material);
          carMesh.position.set(0, 0.4, 0);
          scene.add(carMesh);
          cars[id] = { mesh: carMesh, targetX: pData.targetX, zPos: pData.zPos, accelerating: pData.accelerating };
        }
      }
    });

    socket.on('update-car-state', (data) => {
      if (cars[data.playerId]) {
        cars[data.playerId].targetX = data.targetX;
        cars[data.playerId].zPos = data.zPos;
        cars[data.playerId].accelerating = data.accelerating;
      } else {
        const geometry = new THREE.BoxGeometry(1, 0.8, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0xff1744 });
        const carMesh = new THREE.Mesh(geometry, material);
        scene.add(carMesh);
        cars[data.playerId] = { mesh: carMesh, targetX: data.targetX, zPos: data.zPos, accelerating: data.accelerating };
      }
    });

    socket.on('player-left', (data) => {
      if (cars[data.playerId]) {
        scene.remove(cars[data.playerId].mesh);
        delete cars[data.playerId];
      }
    });

    btn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            alert("Motion permission is required to steer!");
            return;
          }
        } catch (e) {
          console.error("Permission error:", e);
        }
      }

      overlay.style.display = 'none';
      gasPedal.style.display = 'flex';
      socket.emit('join-game');

      window.addEventListener('deviceorientation', (e) => {
        let steeringVal = e.beta || 0; 
        let mappedX = (steeringVal / 35) * 5;
        targetX = Math.max(-6, Math.min(6, mappedX));
      }, true);
    });

    gasPedal.addEventListener('touchstart', (e) => { e.preventDefault(); isAccelerating = true; gasPedal.classList.add('active'); });
    gasPedal.addEventListener('touchend', (e) => { e.preventDefault(); isAccelerating = false; gasPedal.classList.remove('active'); });
    gasPedal.addEventListener('mousedown', () => { isAccelerating = true; gasPedal.classList.add('active'); });
    gasPedal.addEventListener('mouseup', () => { isAccelerating = false; gasPedal.classList.remove('active'); });

    function animate() {
      requestAnimationFrame(animate);

      if (isAccelerating) {
        zPos -= 0.25;
      }

      if (myPlayerId) {
        socket.emit('steering-input', {
          playerId: myPlayerId,
          targetX: targetX,
          zPos: zPos,
          accelerating: isAccelerating
        });

        if (cars[myPlayerId]) {
          cars[myPlayerId].targetX = targetX;
          cars[myPlayerId].zPos = zPos;
          cars[myPlayerId].accelerating = isAccelerating;
        }
      }

      for (let id in cars) {
        let data = cars[id];
        let carMesh = data.mesh;

        carMesh.position.x += (data.targetX - carMesh.position.x) * 0.1;
        carMesh.position.z = data.zPos;

        if (data.accelerating) {
          carMesh.rotation.z = -(data.targetX * 0.05);
          carMesh.rotation.x = 0.1;
        } else {
          carMesh.rotation.z = 0;
          carMesh.rotation.x = 0;
        }

        // Lock camera directly behind your car as it drives forward
        if (id === myPlayerId) {
          camera.position.x = carMesh.position.x * 0.5;
          camera.position.z = carMesh.position.z + 5;
          camera.lookAt(carMesh.position.x, carMesh.position.y, carMesh.position.z - 3);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
