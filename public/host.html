<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UberRacer: Host & Leaderboard</title>
  <style>
    body { 
      margin: 0; background: #0f172a; color: white; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      min-height: 100vh; overflow: hidden; padding: 20px;
    }
    h1 { color: #00e676; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
    p { color: #94a3b8; font-size: 15px; margin-top: 0; margin-bottom: 25px; }
    
    .main-grid { display: flex; gap: 30px; width: 100%; max-width: 900px; }
    
    .card {
      flex: 1; background: rgba(30, 41, 59, 0.7); border: 2px solid rgba(255, 255, 255, 0.1); 
      border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
    }
    h2 { color: #facc15; margin-top: 0; font-size: 20px; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
    
    #qrcode { background: white; padding: 12px; display: inline-block; border-radius: 10px; margin: 10px 0; }
    
    .lb-row {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.8); padding: 12px 16px; border-radius: 10px;
      margin-bottom: 8px; font-size: 16px; font-weight: bold; border-left: 4px solid #00e676;
    }
    .lb-row span { color: #fff; }
    .lb-row strong { color: #00e676; font-size: 18px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <h1>UberRacer: PSU Edition</h1>
  <p>Live Projector & Judge Display</p>

  <div class="main-grid">
    <!-- QR Code Section -->
    <div class="card">
      <h2>Scan to Join</h2>
      <div id="qrcode"></div>
      <p style="margin-top: 15px; margin-bottom: 0;">Connected Drivers: <span id="count" style="font-weight: bold; color: #00e676;">0</span></p>
    </div>

    <!-- Leaderboard Section -->
    <div class="card">
      <h2>🏆 Live Leaderboard</h2>
      <div id="leaderboard-list">
        <p style="color: #64748b; font-style: italic;">Waiting for drivers to launch shift...</p>
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    // Point this to your active ngrok tunnel URL
    const controllerUrl = 'https://ecology-emotion-magma.ngrok-free.dev/controller.html';
    new QRCode(document.getElementById("qrcode"), {
      text: controllerUrl,
      width: 160,
      height: 160,
    });

    let activePlayers = new Set();

    socket.on('sync-players', (players) => {
      activePlayers = new Set(Object.keys(players));
      document.getElementById('count').innerText = activePlayers.size;
    });

    socket.on('player-left', (data) => {
      activePlayers.delete(data.playerId);
      document.getElementById('count').innerText = activePlayers.size;
    });

    // Receive sorted leaderboard from server
    socket.on('update-leaderboard', (leaderboard) => {
      const lbList = document.getElementById('leaderboard-list');
      let html = '';
      
      if (!leaderboard || leaderboard.length === 0) {
        lbList.innerHTML = '<p style="color: #64748b; font-style: italic;">Waiting for drivers to launch shift...</p>';
        return;
      }

      leaderboard.forEach((entry, index) => {
        html += `
          <div class="lb-row">
            <span>#${index + 1} &nbsp; ${entry.name} <small style="color:#94a3b8; font-size:11px;">(${entry.carClass})</small></span>
            <strong>$${entry.tips}</strong>
          </div>
        `;
      });
      lbList.innerHTML = html;
    });
  </script>
</body>
</html>
