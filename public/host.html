<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Race Host & Announcer</title>
  <style>
    body { 
      margin: 0; 
      background: #0f0f0f; 
      color: white; 
      font-family: sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      overflow: hidden; 
    }
    .container { 
      text-align: center; 
      background: rgba(20,20,20,0.95); 
      padding: 40px; 
      border-radius: 16px; 
      border: 2px solid #333; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      max-width: 500px; 
      width: 100%; 
    }
    h1 { color: #00e676; margin-bottom: 10px; }
    #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 8px; margin: 20px 0; }
    #announcer-box { margin-top: 25px; background: rgba(255, 215, 0, 0.15); border-left: 4px solid gold; padding: 15px; border-radius: 6px; font-style: italic; text-align: left; }
    #announcer-box h3 { margin: 0 0 5px 0; color: gold; font-style: normal; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <h1>TrackRacer 3D</h1>
    <p>Scan with your iPhone to launch controller:</p>
    
    <div id="qrcode"></div>
    
    <p>Connected Racers: <span id="count" style="font-weight: bold; color: #00e676;">0</span></p>

    <div id="announcer-box">
      <h3>Live Race Announcer</h3>
      <span id="commentary">Waiting for racers to join the grid...</span>
    </div>
  </div>

  <script>
    const socket = io();

    // Dynamically generates the QR code pointing to your ngrok tunnel
    const controllerUrl = 'https://ecology-emotion-magma.ngrok-free.dev/controller.html';
    new QRCode(document.getElementById("qrcode"), {
      text: controllerUrl,
      width: 180,
      height: 180,
    });

    let activePlayers = new Set();

    socket.on('player-joined', (data) => {
      activePlayers.add(data.playerId);
      document.getElementById('count').innerText = activePlayers.size;
    });

    socket.on('player-left', (data) => {
      activePlayers.delete(data.playerId);
      document.getElementById('count').innerText = activePlayers.size;
    });

    socket.on('announcer-speak', (data) => {
      document.getElementById('commentary').innerText = `"${data.text}"`;
    });
  </script>
</body>
</html>
