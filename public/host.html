<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UberRacer: Host & Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #7ad7ff; --grass: #5cbf4a; --grass2: #4fae3e; --dirt: #9a6330; --cream: #fff3c4;
      --ink: #2b1d0e; --gold: #ffd23f; --silver: #cfd8e3; --bronze: #e0883c; --red: #ff5a5f; --blue: #2f6bff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; padding: 24px 24px 260px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;   /* title on top, cards centred in the space above the road */
      font-family: 'Press Start 2P', 'Courier New', monospace; color: var(--ink); image-rendering: pixelated;
      /* sky on top, checkerboard grass below */
      background: var(--sky);
    }

    /* ---- sky decorations ---- */
    .sun { position: fixed; top: 22px; right: 48px; width: 56px; height: 56px; background: var(--gold); border: 6px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
    .cloud { position: fixed; width: 20px; height: 20px; background: #fff; box-shadow: 20px 0 #fff, 40px 0 #fff, 60px 0 #fff, 10px -20px #fff, 30px -20px #fff, 50px -20px #fff, 0 6px 0 #dff3ff inset; animation: drift 70s linear infinite; z-index: 0; }
    .c1 { top: 40px; left: -100px; }
    .c2 { top: 110px; left: -100px; animation-duration: 95s; animation-delay: -40s; transform: scale(.7); }
    /* ---- in-match layout: just the timer + ranking ---- */
    #top-timer { display: none; margin-top: 4px; }
    #top-timer .lbl { font-size: 12px; color: var(--ink); margin-bottom: 8px; }
    #top-timer #clock { display: inline-block; margin: 0; padding: 10px 26px; font-size: 56px; color: var(--gold); background: var(--ink); border: 6px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.35); }
    #top-timer #clock.low { color: var(--red); }
    body.playing .sub, body.playing .qr-card, body.playing .press { display: none !important; }
    body.playing #top-timer { display: block; }
    body.playing header { margin-bottom: 18px; }
    body.playing h1 { font-size: 26px; margin-bottom: 14px; }
    body.playing .main-grid { max-width: 760px; min-height: 0; }
    body.playing .main-grid.many { max-width: 1000px; }
    body.playing .card { display: flex; flex-direction: column; min-height: 0; }
    body.playing #leaderboard-list { overflow: hidden; }
    body.playing .main-grid.many #leaderboard-list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    body.playing .lb-row { margin-bottom: 10px; padding: 8px 10px; }
    body.playing .main-grid.many .lb-row { margin-bottom: 8px; padding: 6px 8px; }
    body.playing .who { font-size: 14px; }
    body.playing .money { font-size: 16px; }
    @keyframes drift { to { left: 105vw; } }

    header { position: relative; z-index: 1; text-align: center; margin-bottom: 34px; }
    h1 {
      margin: 0 0 12px; font-size: 40px; font-weight: normal; color: var(--gold); letter-spacing: 2px;
      text-shadow: 4px 0 var(--ink), -4px 0 var(--ink), 0 4px var(--ink), 0 -4px var(--ink), 4px 4px var(--ink), -4px -4px var(--ink), 4px -4px var(--ink), -4px 4px var(--ink), 8px 8px 0 var(--ink);
    }
    .sub { display: inline-block; background: var(--red); color: #fff; border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 8px 12px; font-size: 11px; }

    .main-grid { position: relative; z-index: 1; display: flex; gap: 40px; width: 100%; max-width: 1000px; margin: auto 0; align-items: stretch; }

    /* ---- chunky wooden-sign panels ---- */
    .card { flex: 1 1 0; min-width: 0; background: var(--cream); border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); text-align: center; }
    .card h2 { margin: 0; padding: 14px 10px; font-size: 14px; font-weight: normal; color: var(--cream); background: var(--dirt); border-bottom: 6px solid var(--ink); text-shadow: 3px 3px 0 var(--ink); }
    .card .body { padding: 22px 18px; }

    #qrcode { display: inline-block; background: #fff; padding: 12px; border: 6px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
    #qrcode img, #qrcode canvas { image-rendering: pixelated; }
    .press .need { font-size: 11px; color: var(--red); line-height: 2; }
    .press { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 3; background: #fff; border: 6px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 14px 22px; font-size: 11px; color: var(--blue); white-space: nowrap; text-align: center; }
    .press span { display: inline-block; animation: blink 1s steps(2) infinite; }
    #press-text { cursor: pointer; }
    #press-text:active { transform: translateY(3px); }
    .len { margin-top: 14px; font-size: 8px; line-height: 2.2; color: var(--ink); }
    .len b { color: var(--red); }
    input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 240px; height: 22px; margin: 6px auto 0; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 10px; background: var(--ink); }
    input[type=range]::-moz-range-track { height: 10px; background: var(--ink); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -6px; background: var(--gold); border: 4px solid var(--ink); border-radius: 0; }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: var(--gold); border: 4px solid var(--ink); border-radius: 0; }
    #clock { font-size: 28px; margin-top: 10px; color: var(--ink); }
    #clock.low { color: var(--red); animation: blink 1s steps(2) infinite; }

    #results { display: none; position: fixed; inset: 0; z-index: 20; align-items: center; justify-content: center; background: rgba(43, 29, 14, .6); }
    .res-card { flex: none; width: 92%; max-width: 560px; }
    .winner { font-size: 12px; line-height: 2; }
    .winner span:nth-child(1) { font-size: 22px; color: var(--gold); text-shadow: 3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink), 3px 3px var(--ink), -3px -3px var(--ink), 3px -3px var(--ink), -3px 3px var(--ink); }
    #res-rank { margin: 16px 0 6px; }
    #res-awards { margin: 14px 0; text-align: left; }
    .award { font-size: 9px; line-height: 1.9; padding: 8px 10px; margin-bottom: 8px; background: #fff; border: 4px solid var(--ink); }
    .award b { color: var(--red); font-weight: normal; }
    .award small { color: #7a6a52; font-size: 8px; }
    .btn { margin-top: 6px; padding: 13px 26px; font-family: inherit; font-size: 13px; color: #fff; cursor: pointer; background: var(--grass); border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink); text-shadow: 3px 3px 0 var(--ink); }
    .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
    @keyframes blink { 50% { opacity: 0; } }
    .count { margin-top: 18px; font-size: 11px; }
    .count span { display: inline-block; min-width: 34px; background: var(--ink); color: var(--gold); padding: 6px 8px; }

    .lb-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 10px 12px; text-align: left;
      background: #fff; border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); animation: pop .35s steps(4);
    }
    .rank { flex: none; width: 38px; height: 38px; display: grid; place-items: center; font-size: 13px; background: var(--cream); border: 4px solid var(--ink); }
    .r1 .rank { background: var(--gold); } .r2 .rank { background: var(--silver); } .r3 .rank { background: var(--bronze); }
    .r1 { background: #fff9d6; }
    .who { flex: 1; font-size: 12px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who small { display: block; font-size: 8px; color: #7a6a52; }
    .money { font-size: 14px; color: #1f8a3b; }
    .empty { font-size: 10px; line-height: 1.8; color: #7a6a52; padding: 14px 0; }
    @keyframes pop { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* ---- 3D grass field: a tilted checkerboard that recedes to the horizon ---- */
    .world { position: fixed; left: 0; right: 0; top: 50vh; bottom: 0; z-index: 0; overflow: hidden; perspective: 800px; perspective-origin: 50% 0; }
    .field {
      position: absolute; top: 0; left: -100%; width: 300%; height: 700px; transform-origin: 50% 0; transform: rotateX(75deg);
      background: conic-gradient(var(--grass) 25%, var(--grass2) 0 50%, var(--grass) 0 75%, var(--grass2) 0) 0 0 / 120px 120px;
    }
    .world::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 70px; background: linear-gradient(var(--sky), transparent); }

    /* ---- road along the bottom with little pixel cars ---- */
    .roadside { position: fixed; left: 0; right: 0; bottom: 90px; height: 44px; z-index: 2; display: flex; justify-content: space-around; align-items: flex-end; font-size: 34px; }
    .roadside > i { position: relative; display: block; width: 28px; height: 40px; animation: bob 1.6s steps(2) infinite; }
    .roadside > i:nth-child(even) { animation-delay: -.8s; }
    .roadside > i::before { content: ''; position: absolute; left: 0; top: 0; width: 28px; height: 26px; background: var(--leaf); border: 4px solid var(--ink); box-shadow: inset -6px -6px 0 rgba(0,0,0,.18); }
    .roadside > i::after { content: ''; position: absolute; left: 10px; top: 26px; width: 8px; height: 14px; background: #7a4a1f; border: 3px solid var(--ink); border-top: none; }
    .roadside > i.pine { width: 22px; } .roadside > i.pine::before { width: 22px; height: 32px; } .roadside > i.pine::after { left: 7px; top: 32px; height: 8px; }
    .roadside > i.flower { height: 26px; } .roadside > i.flower::before { left: 4px; width: 16px; height: 16px; box-shadow: none; }
    .roadside > i.flower::after { left: 10px; top: 16px; width: 4px; height: 10px; background: #3f9d3a; border: none; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    .road { position: fixed; left: 0; right: 0; bottom: 0; height: 90px; z-index: 2; border-top: 8px solid var(--ink); overflow: hidden;
      background: repeating-linear-gradient(90deg, var(--gold) 0 28px, transparent 28px 56px) 0 50% / 100% 6px no-repeat, #4a4f5a; }
    .car { position: absolute; left: -140px; bottom: 14px; width: 64px; height: 22px; background: var(--c); border: 4px solid var(--ink);
      box-shadow: inset -6px 0 0 #ffe66b; animation: drive var(--t) linear infinite; animation-delay: var(--d); }
    .car::before { content: ''; position: absolute; left: 12px; top: -18px; width: 30px; height: 14px; background: #cfeeff; border: 4px solid var(--ink); border-bottom: none; }
    .car::after { content: ''; position: absolute; left: 6px; bottom: -10px; width: 12px; height: 12px; background: #222; box-shadow: 34px 0 #222, 0 0 0 3px var(--ink), 34px 0 0 3px var(--ink); }
    .car.big { width: 88px; } .car.big::before { width: 54px; left: 10px; } .car.big::after { box-shadow: 58px 0 #222, 0 0 0 3px var(--ink), 58px 0 0 3px var(--ink); }
    .car.lux { box-shadow: inset -6px 0 0 #ffe66b, inset 0 -5px 0 #d4af37; }
    .car.rev { bottom: 50px; transform: scaleX(-1); animation-direction: reverse; }
    @keyframes drive { from { left: -140px; } to { left: 100vw; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="world"><div class="field"></div></div>
  <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>

  <header>
    <h1>UBER RACER</h1>
    <div id="top-timer"><div class="lbl">TIME LEFT</div><div id="clock">0:00</div></div>
  </header>

  <div class="main-grid" id="main-grid">
    <div class="card qr-card">
      <h2>SCAN TO JOIN</h2>
      <div class="body">
        <div id="qrcode"></div>
        <div class="count">DRIVERS <span id="count">0</span></div>
      </div>
    </div>

    <div class="card">
      <h2 id="lb-title">TOP TIPS</h2>
      <div class="body" id="leaderboard-list">
        <div class="empty">WAITING FOR DRIVERS...<br>BEEP BEEP!</div>
      </div>
    </div>
  </div>

  <div class="press">
    <div id="press-lobby">
      <div id="press-text" onclick="startGame()"><span id="press-span">▶ PRESS START ◀</span></div>
      <div class="len">GAME LENGTH <b id="len-val">4</b> MIN<input type="range" id="len" min="1" max="10" value="4"></div>
    </div>
  </div>

  <div id="results">
    <div class="card res-card">
      <h2>TIME'S UP!</h2>
      <div class="body">
        <div class="winner">WINNER<br><span id="win-name"></span><br><span id="win-tips"></span></div>
        <div id="res-rank"></div>
        <div id="res-awards"></div>
        <button class="btn" onclick="playAgain()">▶ PLAY AGAIN</button>
      </div>
    </div>
  </div>
  <div class="roadside"><i class="" style="--leaf:#3f9d3a"></i><i class="flower" style="--leaf:#ff7eb6"></i><i class="pine" style="--leaf:#2f7d32"></i><i class="" style="--leaf:#e8731a"></i><i class="" style="--leaf:#3f9d3a"></i><i class="flower" style="--leaf:#fff"></i><i class="pine" style="--leaf:#2f7d32"></i><i class="" style="--leaf:#c0392b"></i><i class="" style="--leaf:#3f9d3a"></i><i class="flower" style="--leaf:#ffd23f"></i><i class="pine" style="--leaf:#2f7d32"></i><i class="" style="--leaf:#e8a317"></i></div>
  <div class="road">
    <i class="car" style="--c:#00e676;--t:11s;--d:-2s"></i>
    <i class="car lux" style="--c:#14141c;--t:8s;--d:-6s"></i>
    <i class="car big" style="--c:#38bdf8;--t:15s;--d:-10s"></i>
    <i class="car rev" style="--c:#ff5a5f;--t:12s;--d:-4s"></i>
    <i class="car rev big" style="--c:#ffd23f;--t:18s;--d:-13s"></i>
    <i class="car rev lux" style="--c:#14141c;--t:9s;--d:-8s"></i>
  </div>

  <script>
    const socket = io();

    // Point this to your active ngrok tunnel URL
    const controllerUrl = 'https://ecology-emotion-magma.ngrok-free.dev/controller.html';
    const qrBox = document.getElementById('qrcode');
    try { new QRCode(qrBox, { text: controllerUrl, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { console.error('QR failed', e); }
    setTimeout(() => {   // if the QR library didn't load/draw, show the link instead of an empty box
      if (!qrBox.querySelector('canvas, img')) qrBox.innerHTML = '<div style="width:200px;font-size:8px;line-height:1.8;word-break:break-all">QR UNAVAILABLE<br><br>' + controllerUrl + '</div>';
    }, 600);

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let activePlayers = new Set();
    let gameState = 'lobby', endsLocal = 0, minPlayers = 4;
    const $ = id => document.getElementById(id);

    socket.on('connect', () => socket.emit('host-join'));        // tells the server this screen is the host

    // ---- host controls ----
    $('len').addEventListener('input', () => { $('len-val').innerText = $('len').value; });
    function startGame() {
      if (gameState !== 'lobby' || activePlayers.size < minPlayers) return;
      socket.emit('host-start', { minutes: Number($('len').value) });
    }
    function playAgain() { socket.emit('host-reset'); }
    function refreshPress() {
      const ready = activePlayers.size >= minPlayers, ps = $('press-span');
      if (ready) { ps.className = ''; ps.innerText = '▶ PRESS START ◀'; }
      else {
        const n = minPlayers - activePlayers.size;
        ps.className = 'need'; ps.innerHTML = 'NEED ' + n + ' MORE DRIVER' + (n > 1 ? 'S' : '') + '<br>(MIN ' + minPlayers + ')';
      }
      $('press-text').style.cursor = ready ? 'pointer' : 'not-allowed';
      $('press-text').style.opacity = ready ? '1' : '.85';
    }
    socket.on('game-info', (g) => {
      gameState = g.state; endsLocal = Date.now() + g.remainingMs;
      if (g.minPlayers) minPlayers = g.minPlayers;
      document.body.classList.toggle('playing', g.state === 'playing');
      $('lb-title').innerText = g.state === 'playing' ? 'RANKING' : 'TOP TIPS';
      $('press-lobby').style.display = g.state === 'lobby' ? 'block' : 'none';
      document.querySelector('.press').style.display = g.state === 'lobby' ? 'block' : 'none';
      refreshPress();
      if (g.state !== 'ended') $('results').style.display = 'none';
    });
    socket.on('game-ended', (r) => {
      $('win-name').innerText = r.winner ? r.winner.name : '-';
      $('win-tips').innerText = r.winner ? '$' + r.winner.tips : '';
      $('res-rank').innerHTML = r.ranking.slice(0, 4).map((e, i) => `
        <div class="lb-row r${i + 1}"><div class="rank">${i + 1}</div><div class="who">${esc(e.name)}<small>${esc(e.carClass)}</small></div><div class="money">$${e.tips}</div></div>`).join('');
      $('res-awards').innerHTML = r.awards.length
        ? r.awards.map(a => `<div class="award"><b>${esc(a.title)}</b><br>${esc(a.name)} <small>${esc(a.detail)}</small></div>`).join('')
        : '<div class="award">NO AWARDS THIS ROUND</div>';
      $('results').style.display = 'flex';
    });
    setInterval(() => {
      if (gameState !== 'playing') return;
      const s = Math.ceil(Math.max(0, endsLocal - Date.now()) / 1000);
      $('clock').innerText = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      $('clock').classList.toggle('low', s <= 10);
    }, 250);

    socket.on('sync-players', (players) => {
      activePlayers = new Set(Object.keys(players));
      document.getElementById('count').innerText = activePlayers.size; refreshPress();
    });
    socket.on('player-left', (data) => {
      activePlayers.delete(data.playerId);
      document.getElementById('count').innerText = activePlayers.size; refreshPress();
    });

    let lastKey = '';
    socket.on('update-leaderboard', (leaderboard) => {
      const list = document.getElementById('leaderboard-list');
      if (!leaderboard || leaderboard.length === 0) {
        list.innerHTML = '<div class="empty">WAITING FOR DRIVERS...<br>BEEP BEEP!</div>';
        lastKey = ''; return;
      }
      const key = JSON.stringify(leaderboard);
      if (key === lastKey) return;      // don't replay the pop animation when nothing changed
      lastKey = key;
      $('main-grid').classList.toggle('many', leaderboard.length > 6);
      list.innerHTML = leaderboard.map((e, i) => `
        <div class="lb-row r${i + 1}">
          <div class="rank">${i + 1}</div>
          <div class="who">${esc(e.name)}<small>${esc(e.carClass)}</small></div>
          <div class="money">$${e.tips}</div>
        </div>`).join('');
    });
  </script>
</body>
</html>
